<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GitHub Pages Subpath Normalizer: ensures relative paths resolve inside repository -->
    <script>
      (function () {
        try {
          var p = window.location.pathname;
          var host = window.location.hostname;
          if (host.indexOf('github.io') !== -1) {
            var parts = p.split('/').filter(Boolean);
            if (parts.length === 1 && !p.endsWith('/')) {
              window.location.replace(window.location.origin + p + '/' + window.location.search + window.location.hash);
            }
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Primary SEO Meta Tags for Google Search -->
    <title>THREADLAB — Clothing & Apparel Store | Premium Minimalist Fashion</title>
    <meta name="title" content="THREADLAB — Clothing & Apparel Store | Premium Minimalist Fashion" />
    <meta name="description" content="Shop THREADLAB for heavyweight plain & printed t-shirts, gym apparel, selvedge denim jeans, tailored trousers, and French terry hoodies with free delivery across India." />
    <meta name="keywords" content="THREADLAB, clothing brand, online apparel store, plain t-shirts, printed tees, gym t-shirts, selvedge denim jeans, hoodies, streetwear India, oversize t-shirts" />
    <meta name="author" content="THREADLAB Apparel Co." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- OpenGraph / Facebook Social Sharing Tags -->

    <meta property="og:site_name" content="THREADLAB" />

    <meta property="og:image" content="./images/threadlab_hero_banner_1793012315049.jpg" />

    <meta name="twitter:image" content="./images/threadlab_hero_banner_1793012315049.jpg" />

    <!-- Google Fonts -->

    <!-- Schema.org Structured Data (JSON-LD) for Google Search Rich Results -->

    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "THREADLAB",
      "alternateName": "THREADLAB Apparel",
      "description": "Modern online clothing shopping website featuring heavyweight cotton tees, selvedge jeans, joggers, and hoodies.",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Cash, Credit Card, UPI, NetBanking",
      "priceRange": "₹499 - ₹2999",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "THREADLAB Clothing Catalogue",
        "itemListElement": [
          { "@type": "OfferCatalog", "name": "Plain T-shirts" },
          { "@type": "OfferCatalog", "name": "Printed T-shirts" },
          { "@type": "OfferCatalog", "name": "Gym T-shirts" },
          { "@type": "OfferCatalog", "name": "Shirts" },
          { "@type": "OfferCatalog", "name": "Jeans" },
          { "@type": "OfferCatalog", "name": "Trousers" },
          { "@type": "OfferCatalog", "name": "Shorts" },
          { "@type": "OfferCatalog", "name": "Joggers" },
          { "@type": "OfferCatalog", "name": "Hoodies & Sweatshirts" }
        ]
      }
    }
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 font-sans antialiased selection:bg-stone-900 selection:text-white">

    <div id="root">

        <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 6px;">THREADLAB</div>
        <div style="font-size: 13px; font-weight: 600; color: #78716c; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 24px;">Heavyweight Apparel & Basics</div>
        <div style="width: 28px; height: 28px; border: 3px solid #e7e5e4; border-top-color: #1c1917; border-radius: 50%; animation: tl-spin 0.75s linear infinite; margin-bottom: 16px;"></div>

        <style>@keyframes tl-spin { to { transform: rotate(360deg); } }</style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
